[env:nucleo_f303k8]
platform = ststm32
board = nucleo_f303k8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
test_ignore = *

; Host-side unit tests: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
test_build_src = yes
build_src_filter = -<*> +<safety.cpp> +<controller.cpp>
